services:
  - type: web
    name: code-cloner
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: DATA_DIR
        value: /var/data
    disk:
      name: code-cloner-data
      mountPath: /var/data
      sizeGB: 1
